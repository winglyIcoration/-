<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>制約ワードウルフ</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./game-core.js" defer></script>
  <script src="./firebase-config.js" defer></script>
  <script type="module" src="./room-sync.js"></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <section id="screen-home" class="screen is-active">
      <div class="hero">
        <p class="eyebrow">Master + Room Code</p>
        <h1>制約ワードウルフ</h1>
        <p>マスター端末で部屋を作り、参加者は自分のスマホから部屋コードを入力して参加します。</p>
      </div>

      <div id="config-warning" class="notice hidden"></div>

      <div class="panel stack">
        <button id="create-room-button" class="button primary full">マスターとして部屋を作る</button>
      </div>

      <div class="panel stack">
        <h2>部屋に参加</h2>
        <label class="field-label">
          部屋コード
          <input id="join-code" class="input code-input" type="text" maxlength="4" autocomplete="off" placeholder="ABCD">
        </label>
        <label class="field-label">
          名前
          <input id="join-name" class="input" type="text" maxlength="16" autocomplete="off" placeholder="あなたの名前">
        </label>
        <button id="join-room-button" class="button success full">参加する</button>
      </div>

      <div class="rule-card">
        <h2>新ルール</h2>
        <ul>
          <li>各週の開始時、生存者は30秒で伏せワードを入力します。</li>
          <li>同じ週内の偶然の被りはセーフです。公開済みワードは次週以降禁止です。</li>
          <li>容疑者はログ入力できませんが、生存者の開示後に声だけで介入できます。</li>
          <li>通常投票で人狼を当てれば村人勝利。外した村人は容疑者になります。</li>
        </ul>
      </div>
    </section>

    <section id="screen-host" class="screen">
      <header class="screen-header">
        <div>
          <p class="eyebrow">Master</p>
          <h1>マスター画面</h1>
        </div>
        <button class="button ghost small" data-action="leave">退出</button>
      </header>

      <div class="room-code-card">
        <span>部屋コード</span>
        <strong id="host-room-code">----</strong>
      </div>

      <div class="stack">
        <section id="host-setup-panel" class="panel"></section>
        <section class="panel">
          <h2>参加者</h2>
          <div id="host-player-list" class="chips"></div>
        </section>
        <section id="host-participant-panel" class="panel hidden"></section>
        <div id="host-player-card" class="private-card compact hidden"></div>
        <section id="host-phase-panel" class="panel"></section>
        <section class="panel">
          <h2>公開ログ</h2>
          <div id="host-log" class="word-log"></div>
        </section>
      </div>
    </section>

    <section id="screen-player" class="screen">
      <header class="screen-header">
        <div>
          <p class="eyebrow">Player</p>
          <h1 id="player-title">参加者画面</h1>
        </div>
        <button class="button ghost small" data-action="leave">退出</button>
      </header>

      <div id="player-card" class="private-card compact hidden"></div>

      <div class="stack">
        <section id="player-phase-panel" class="panel"></section>
        <section class="panel">
          <h2>参加者</h2>
          <div id="player-list" class="chips"></div>
        </section>
        <section class="panel">
          <h2>公開ログ</h2>
          <div id="player-log" class="word-log"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
